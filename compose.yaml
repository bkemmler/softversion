services:
  softversion:
    build: .
    image: softversion:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_SECRET: ${APP_SECRET:?APP_SECRET fehlt - in .env setzen (Vorlage: env.example)}
      TZ: ${TZ:-Europe/Berlin}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - softversion-data:/data

volumes:
  softversion-data:
